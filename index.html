<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Language Grammar Visualizer | Syntax Matrix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Bảng Settings Góc Phải -->
    <div class="settings-wrapper">
        <button id="settingsToggleBtn" class="settings-btn" title="Cài đặt">
            <!-- Icon Bánh Răng CSS -->
            <div class="gear-icon">
                <div class="tooth"></div>
                <div class="tooth"></div>
                <div class="tooth"></div>
                <div class="center-hole"></div>
            </div>
        </button>
        <div id="settingsPanel" class="settings-panel">
            <div class="setting-item">
                <label for="dimSlider">Độ mờ khi Hover:</label>
                <input type="range" id="dimSlider" min="0" max="1" step="0.1" value="0.25">
            </div>
            <div class="setting-item">
                <label for="fontSlider">Cỡ chữ:</label>
                <input type="range" id="fontSlider" min="0.8" max="1.5" step="0.1" value="1.1">
            </div>
            <!-- Bổ sung nút gạt Hiện nhãn SVO -->
            <div class="setting-item">
                <label for="labelToggle">Hiện nhãn [SVO]:</label>
                <label class="switch">
                    <input type="checkbox" id="labelToggle" checked>
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="setting-item">
                <label for="phoneticToggle">Hiện phiên âm:</label>
                <label class="switch">
                    <input type="checkbox" id="phoneticToggle">
                    <span class="slider round"></span>
                </label>
            </div>
        </div>
    </div>

    <header>
        <h1>Syntax Matrix</h1>
        <p class="subtitle">Khám phá và so sánh trật tự ngữ pháp giữa 4 ngôn ngữ qua kết nối trực quan.</p>
    </header>

    <div class="selector-container">
        <select id="context-selector">
            <option value="" disabled selected>Đang tải dữ liệu...</option>
        </select>
    </div>

    <div class="grammar-board-wrapper" id="board-wrapper">
        <svg id="svg-canvas">
            <defs>
                <!-- Mũi tên được thiết kế lại: Thêm phần đuôi vươn về sau để lấp khoảng trống -->
                <marker id="arrow" viewBox="0 0 24 10" refX="22" refY="5"
                    markerWidth="6" markerHeight="6" orient="auto">
                    <!-- Đuôi đặc lùi về sau (dài 14px) -->
                    <line x1="0" y1="5" x2="14" y2="5" stroke="var(--accent-color)" stroke-width="1.5" />
                    <!-- Đầu tam giác -->
                    <path d="M 13 0 L 24 5 L 13 10 z" fill="var(--accent-color)" />
                </marker>
            </defs>
        </svg>

        <div class="grammar-board" id="grammar-board"></div>
    </div>

    <div class="instruction">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><path d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        <span>Rê chuột (hover) vào BẤT CỨ từ nào để xem sự dịch chuyển vị trí tương ứng ở các ngôn ngữ khác.</span>
    </div>

    <!-- Modal cho giải thích -->
    <div id="explanationModal" class="modal-overlay">
        <div class="modal-content">
            <button id="closeModal" class="close-btn">&times;</button>
            <div class="modal-header">
                <span id="modalLang" class="modal-lang-badge"></span>
                <span id="modalTagLabel" class="modal-tag-badge"></span>
            </div>
            <h2 id="modalWord" class="modal-word"></h2>
            <p id="modalPhonetic" class="modal-phonetic"></p>
            <div class="modal-body">
                <p id="modalExplanation" class="modal-explanation-text"></p>
            </div>
        </div>
    </div>

    <script src="js/svgDrawer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
